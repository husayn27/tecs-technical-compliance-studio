[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tecs-lighting-engine"
version = "0.1.0"
description = "Local document extraction and quotation engine for TECS Lighting Quotation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "pydantic>=2.10",
  "pypdf>=5.0",
  "pymupdf>=1.25",
  "openai>=1.70",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "keyring>=25.6",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9", "onnxruntime>=1.22"]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11", "pyinstaller>=6.15"]

[project.scripts]
tecs-engine = "tecs_engine.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tecs_engine"]

[tool.hatch.build]
artifacts = ["src/tecs_engine/assets/*.xlsx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
