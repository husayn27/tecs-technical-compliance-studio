[package]
name = "tecs-lighting-quotation"
version = "0.1.3"
description = "TECS Lighting Quotation"
authors = ["TECS Lighting"]
edition = "2021"

[lib]
name = "tecs_lighting_quotation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
