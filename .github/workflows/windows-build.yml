name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install local engine
        shell: pwsh
        run: pip install -e "services/local_engine[dev,ocr]"

      - name: Build private local engine sidecar
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name tecs-engine `
            --paths services/local_engine/src `
            --collect-all rapidocr `
            --collect-all onnxruntime `
            services/local_engine/sidecar_entry.py
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries
          Copy-Item dist/tecs-engine.exe apps/desktop/src-tauri/binaries/tecs-engine-x86_64-pc-windows-msvc.exe

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: TECS-Lighting-Quotation-Windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
