name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install local engine
        shell: pwsh
        run: pip install -e "services/local_engine[dev,ocr]"

      - name: Build private local engine sidecar
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name tecs-engine `
            --paths services/local_engine/src `
            --collect-data tecs_engine `
            --add-data "services/local_engine/src/tecs_engine/assets;tecs_engine/assets" `
            --collect-all rapidocr `
            --collect-all onnxruntime `
            services/local_engine/sidecar_entry.py
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries
          Copy-Item dist/tecs-engine.exe apps/desktop/src-tauri/binaries/tecs-engine-x86_64-pc-windows-msvc.exe

      - name: Smoke test packaged local engine
        shell: pwsh
        run: |
          $env:TECS_ENGINE_PORT = "18765"
          $engine = Start-Process -FilePath "dist/tecs-engine.exe" `
            -PassThru `
            -RedirectStandardOutput "engine-stdout.log" `
            -RedirectStandardError "engine-stderr.log"
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($engine.HasExited) {
                throw "The packaged TECS engine exited before becoming healthy."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) {
              throw "The packaged TECS engine did not answer its health endpoint within 120 seconds."
            }
            Write-Host "Packaged engine health check passed (version $($health.engine_version))."
          } finally {
            if (-not $engine.HasExited) {
              Stop-Process -Id $engine.Id -Force
            }
            if (Test-Path "engine-stdout.log") { Get-Content "engine-stdout.log" }
            if (Test-Path "engine-stderr.log") { Get-Content "engine-stderr.log" }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: TECS-Lighting-Quotation-Windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
